spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}
  jpa:
    hibernate:
      ddl-auto: validate   # Liquibase owns the schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    # Throwaway signing key for local dev only. Prod MUST set JWT_SECRET via env.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}

logging:
  level:
    com.erp.inventory: DEBUG
